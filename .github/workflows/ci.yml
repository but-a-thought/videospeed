name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Lint, Build, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          check-latest: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/videospeed/tlc
          key: ${{ runner.os }}-tlc-${{ hashFiles('scripts/tlc.mjs') }}

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build:release
      - run: npm run validate:builds
        env:
          NO_UPDATE_NOTIFIER: '1'
      - run: npm test
      - run: npm run test:tlc
      - run: node scripts/package-release.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: videospeed-release-node-${{ matrix.node-version }}
          path: release/videospeed-*.zip
          retention-days: 7

  browser-smoke:
    name: ${{ matrix.browser }} extension smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - run: npx puppeteer browsers install ${{ matrix.browser }}
      - run: npm run build:${{ matrix.browser }}
      - run: node tests/e2e/run-e2e.js --browser=${{ matrix.browser }} --headless
        env:
          CHROME_NO_SANDBOX: '1'
